# Tooling configuration only. This project is not packaged or installed as a
# distribution: the submission is a source tree executed in place, so there is no
# [project] table and no build backend.

[tool.pytest.ini_options]
minversion = "7.0"
# Collect only the maintained suite. Runtime data and generated staging trees
# are not test sources.
testpaths = ["tests"]
norecursedirs = [
    "outputs", "data",
    "submission_staging", "submission_review_bundle_*", "submission_code_handoff_*",
    ".git", "*.egg-info",
]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
# Runtime data and generated package trees are outside the maintained source set.
extend-exclude = [
    "outputs", "data", "submission_staging",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = [
    "E501",  # long lines: many are pinned hashes and recorded commands
]
