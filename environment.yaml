# Canonical reproduction environment for the A-board code inspection.
#
# Target environment stated by the official inspection notice:
#   Ubuntu 22.04, NVIDIA RTX 4090, CUDA 12.4, Python 3.10, Jittor 1.3.10,
#   JittorGeometric, version-pinned NumPy / Pandas / scikit-learn.
#
# Create it with:
#   conda env create -f environment.yaml
#   conda activate jittor-link-prediction-inspect
#   pip install --no-build-isolation --no-deps \
#     git+https://github.com/AlgRUC/JittorGeometric.git@ff7d8ffac7bf3d95cc1962e091c52dc5737492d4
#
# JittorGeometric is NOT on PyPI, so it is installed from the official
# repository as the documented final step rather than through the pip: block.
# It is nonetheless PINNED: upstream publishes no release tag, so the commit
# hash is the authoritative identifier. That commit is dated 2026-06-03; its
# setup.py and installed distribution metadata both report 2.0.0 while the
# package's own __version__ attribute says 0.0.1 -- an upstream inconsistency,
# which is exactly why a commit and not a version string is what is pinned.
# --no-deps stops a transitive requirement from silently upgrading the pinned
# numerical stack; upstream declares no install_requires, so nothing is
# suppressed by it.
#
# The competition requires JittorGeometric to be available in the environment,
# and it is. The maintained production chain does NOT import it: link prediction
# here is a LINE / BPR-MF embedding pair plus LambdaRank over hand-built
# features, and no stage of that needs a graph-neural-network library. No import
# is added merely to claim usage.
#
# Every version below was installed and imported in a clean environment on
# Ubuntu 22.04 with Python 3.10. Two properties are deliberate:
#
#   * Every pin is a version validated for Python 3.10, which the official
#     notice requires. These are the versions this environment was inspected
#     with, not a claim about what upstream publishes today.
#   * numpy is held below 2.0. The frozen postprocessors depend on exact
#     float64 comparison and stable argsort semantics, and the accepted member
#     hashes were produced under the 1.x behaviour.
#
# requirements.txt covers the same dependencies for a pip-only installation
# without conda; the two files pin identical versions.

name: jittor-link-prediction-inspect

channels:
  - conda-forge

dependencies:
  # The official inspection notice requires Python 3.10.
  - python=3.10
  - pip
  - pip:
      # --- numerical core -------------------------------------------------
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.2
      - scikit-learn==1.6.1
      # --- gradient-boosted ranker (dataset1 and dataset2 base matrices) ---
      - lightgbm==4.5.0
      # --- progress reporting in the trainers ------------------------------
      - tqdm==4.67.1
      # --- mandatory competition framework ---------------------------------
      # Jittor compiles its own kernels on first import and needs g++ >= 5.4
      # (Ubuntu 22.04 ships 11.4) plus, for the GPU path, a CUDA toolkit.
      - jittor==1.3.10
